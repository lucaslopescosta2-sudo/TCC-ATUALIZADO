version: '3.8'

services:
  # Container do Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: mysql_db_almox
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_DATABASE: db_almox
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Container da Aplicação Flask
  web:
    build: .
    container_name: flask_almox
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      - DB_HOST=db

volumes:
  mysql_data: